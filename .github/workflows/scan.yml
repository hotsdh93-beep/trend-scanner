# 트렌드 템플릿 스캔 → 휴대폰용 웹앱(GitHub Pages) 갱신
# 시간은 UTC 기준. 한국 시간 = UTC + 9시간
name: 트렌드 스캔

on:
  schedule:
    - cron: "50 8 * * 1-5"    # 한국장: 월~금 17:50 (한국 시간)
    - cron: "20 22 * * 1-5"   # 미국장: 화~토 07:20 (한국 시간) = 월~금 22:20 UTC
  workflow_dispatch:
    inputs:
      market:
        description: "kr(한국) / us(미국) / all(둘 다)"
        default: all
        type: choice
        options: [all, kr, us]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trend-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: pip install --quiet yfinance pandas numpy

      - name: 시장 결정
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then M="${{ inputs.market }}"
          elif [ "${{ github.event.schedule }}" = "50 8 * * 1-5" ]; then M=kr
          else M=us; fi
          echo "MARKET=$M" >> "$GITHUB_ENV"

      - name: 스캔
        run: python trend_scanner.py "$MARKET" --site site

      - name: 스캔 기록 저장
        run: |
          git config user.name "trend-scan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "스캔 $MARKET $(date '+%Y-%m-%d %H:%M')" || echo "변경 없음"
          git pull --rebase --quiet || true
          git push || echo "푸시 실패(다음 실행에서 다시 저장됨)"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
